name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q -o hudson-os.zip -d work
          echo "PROJECT=$(find work -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - working-directory: ${{ env.PROJECT }}
        run: |
          set +e
          gradle :app:assembleDebug --console=plain > build.log 2>&1 && ok=1 || ok=0
          if [ $ok = 0 ]; then
            { echo "### Kotlin errors: $(grep -c '^e: ' build.log)"; echo '```'; grep -E '^e: |error:|ERROR|What went wrong' -A2 build.log | sed -E 's#file://[^ ]*/com/hudson/os/#>#' | head -n 80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hudson-os-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
